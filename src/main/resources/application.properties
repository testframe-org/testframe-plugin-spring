spring.application.name=testframe-plugin-spring
spring.main.banner-mode=off
# Loopback only unless testframe.token is set (config/BindGuard). The port is passed by the caller (--server.port).
server.address=127.0.0.1
server.shutdown=graceful
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
# The projects the tour API serves (folders that contain testframe/); empty = no tour
testframe.projects-dir=${TESTFRAME_PROJECTS_DIR:}
# When set, every /api/v1/** request needs Authorization: Bearer {token}
testframe.token=${TESTFRAME_TOKEN:}
testframe.max-concurrent-runs=4
